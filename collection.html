<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zodiac Collection</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <link rel="stylesheet" href="https://use.typekit.net/fhy2mav.css">
</head>

<body>

<nav class="navbar navbar-dark px-3">
  <a class="navbar-brand" href="index.html">Zodiac Collection</a>
  <a href="about.html" class="text-light">About</a>
</nav>

<div class="container py-4 text-center">

  <h1 class="mb-3">Zodiac Signs</h1>

  <!-- FILTER BUTTONS -->
  <div class="mb-4">
    <button class="btn filter-btn" data-type="all">Show All</button>
    <button class="btn filter-btn" data-type="Sun">Sun</button>
    <button class="btn filter-btn" data-type="Moon">Moon</button>
    <button class="btn filter-btn" data-type="Mercury">Mercury</button>
    <button class="btn filter-btn" data-type="Venus">Venus</button>
    <button class="btn filter-btn" data-type="Mars">Mars</button>
    <button class="btn filter-btn" data-type="Jupiter">Jupiter</button>
    <button class="btn filter-btn" data-type="Saturn">Saturn</button>
    <button class="btn filter-btn" data-type="Uranus">Uranus</button>
    <button class="btn filter-btn" data-type="Neptune">Neptune</button>
    <button class="btn filter-btn" data-type="Pluto">Pluto</button>
  </div>

  <!-- CARDS -->
  <div class="row" id="card-container"></div>
</div>

<!-- MODAL -->
<div id="modal" class="modal-box hidden">
  <div class="modal-content">
    <h2 id="modalTitle"></h2>
    <img id="modalImage" width="100%">
    <p id="modalType"></p>
    <p id="modalPlanet"></p>
    <p id="modalDetail"></p>
    <button id="closeModal" class="btn btn-light">Close</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
