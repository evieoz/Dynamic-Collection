<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Zodiac Collection</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <nav class="site-nav">
    <a href="index.html"> Home</a>
    <a href="about.html"> About</a>
    <a href="collection.html"> Collection</a>
  </nav>

  <div class="shooting-star star1"></div>
  <div class="shooting-star star2"></div>
  <div class="shooting-star star3"></div>

  <div class="container py-5 text-center">

    <h1>Zodiac Signs ✨</h1>

    <div class="mb-5">

      <button class="filter-btn" data-type="all">All</button>
      <button class="filter-btn" data-type="Sun">☀ Sun</button>
      <button class="filter-btn" data-type="Moon">🌙 Moon</button>
      <button class="filter-btn" data-type="Mercury">☿ Mercury</button>
      <button class="filter-btn" data-type="Venus">♀ Venus</button>
      <button class="filter-btn" data-type="Mars">♂ Mars</button>
      <button class="filter-btn" data-type="Jupiter">♃ Jupiter</button>
      <button class="filter-btn" data-type="Saturn">♄ Saturn</button>
      <button class="filter-btn" data-type="Uranus">⛢ Uranus</button>
      <button class="filter-btn" data-type="Neptune">♆ Neptune</button>
      <button class="filter-btn" data-type="Pluto">♇ Pluto</button>

    </div>

    <div class="row" id="card-container"></div>

  </div>


  <div id="modal" class="modal-box hidden">

    <div class="modal-content">

      <span id="closeModal" class="close-x">

        ✕

      </span>

      <h2 id="modalTitle"></h2>
      <img id="modalImage">
      <p id="modalType"></p>
      <p id="modalPlanet"></p>
      <p id="modalDetail"></p>
    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
